<picture class="@@if(context.class){@@class@@if(context.mod){ @@class--@@mod}}@@if(context.animatedImg){ animated animated-img}@@if(context.animatedOpacity){ animated animated-opacity}">

  	<img @@if(context.imgClass){class="@@imgClass"} src="@@src.jpg" alt="фото" width="@@width" height="@@height" loading="lazy">
</picture>
